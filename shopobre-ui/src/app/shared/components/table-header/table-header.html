<div class="table-header mb-2" [class.with-price]="isOrder()" [class.without-price]="!isOrder()">
  <div><input class="form-check-input checkbox-lg" type="checkbox" /></div>
  <div>{{ title() }}</div>
  <div>{{ label() }}</div>
  <div>Status</div>
  @if(isOrder()){
    <div>Price</div>
  }
  <div class="text-center">Action</div>
</div>
