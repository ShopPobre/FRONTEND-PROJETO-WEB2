<div>

    <div class="container">
        <div class="main-container">
            <div class="form-section d-flex flex-column justify-content-center">
                <h1>{{ text() }}</h1>
                <ng-content></ng-content>
                 <button type="button" class="btn-registration">{{ label() }}</button>

            <div class="welcome-section">

                <p>Don't have on account</p>
                <button class="btn-login">{{ buttonText() }}</button>
            </div>
        </div>
    </div>

</div>
