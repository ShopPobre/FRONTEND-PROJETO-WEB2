<div class="container">
  <div class="main-card">
    <h4 class="card-title text-second-color">Edit Your Address</h4>

    <div class="row">
      <div class="col-md-6">
        <app-form-edit
          [type]="'text'"
          [label]="'Street'"
          [placeholder]="'Rua exemplo'"
        ></app-form-edit>
      </div>
      <div class="col-md-6">
        <app-form-edit [type]="'number'" [label]="'Number'" [placeholder]="'000'"></app-form-edit>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <app-form-edit [type]="'text'" [label]="'Cep'" [placeholder]="'123456-789'"></app-form-edit>
      </div>
      <div class="col-md-6">
        <app-form-edit [type]="'text'" [label]="'City'" [placeholder]="'cidade'"></app-form-edit>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <app-form-edit [type]="'text'" [label]="'State'" [placeholder]="'Estado'"></app-form-edit>
      </div>
      <div class="col-md-6">
        <app-form-edit [type]="'text'" [label]="'Type'" [placeholder]="'CASA or TRABALHO'"></app-form-edit>
      </div>
    </div>

    <app-actions-footer [label]="'Save Changes'"></app-actions-footer>
  </div>
</div>
