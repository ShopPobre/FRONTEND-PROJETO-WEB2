<div class="container">
  <div class="main-card">
    <h4 class="card-title text-second-color">Edit Your Profile</h4>

    <div class="row">
      <app-form-edit
        [type]="'text'"
        [label]="'First Name'"
        [placeholder]="'Md'"
        [value]="name()"
        (valueChange)="name.set($event)"
      ></app-form-edit>
    </div>

    <div class="row">
      <div class="col-md-6">
        <app-form-edit
          [type]="'email'"
          [label]="'Email'"
          [placeholder]="'rimel1111@gmail.com'"
          [value]="email()"
          (valueChange)="email.set($event)"
        ></app-form-edit>
      </div>
      <div class="col-md-6">
        <app-form-edit
          [type]="'text'"
          [label]="'Phone'"
          [placeholder]="'1234-5678'"
          [value]="telefone()"
          (valueChange)="telefone.set($event)"
        ></app-form-edit>
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-12">
        <app-form-edit
          [type]="'password'"
          [label]="'Password Changes'"
          [placeholder]="'Current Password'"
          [value]="currentPassword()"
          (valueChange)="currentPassword.set($event)"
        ></app-form-edit>
        <app-form-edit
          [type]="'password'"
          [placeholder]="'New Password'"
          [value]="newPassword()"
          (valueChange)="newPassword.set($event)"
        ></app-form-edit>
        <app-form-edit
          [type]="'password'"
          [placeholder]="'Confirm New Password'"
          [value]="confirmPassword()"
          (valueChange)="confirmPassword.set($event)"
        ></app-form-edit>
      </div>
    </div>
    <app-actions-footer
      [label]="'Save Changes'"
      [cancelRoute]="navegar()"
      (saveChanges)="saveChanges()"
      [disabled]="!isDirty()"
    ></app-actions-footer>
  </div>
</div>
