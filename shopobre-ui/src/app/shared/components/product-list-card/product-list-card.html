<div class="product-card">
  <div><input class="form-check-input" type="checkbox" /></div>
  <div class="product-info">
    <div class="product-img">
      <img
        [src]="productImage()"
        alt="Product"
      />
    </div>
    <div class="product-details">
      <div class="product-name">{{ product().name }}</div>
    </div>
  </div>
  <div class="column-text">{{ product().createdAt }}</div>
  @if (product().isActive) {
    <div class="active">
      <i class="fas fa-check-circle"></i>
    </div>
  } @else {
    <div class="deactive">
      <i class="fas fa-times-circle"></i>
    </div>
  }
  <div class="price-text">R${{ product().price }}</div>
  <div class="action-btns">
    <button class="action-btn edit"><i class="fas fa-pen"></i></button>
    <button class="action-btn delete"><i class="fas fa-trash-alt"></i></button>
  </div>
</div>
